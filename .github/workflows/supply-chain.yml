name: Supply chain

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "37 6 * * 1"
  workflow_dispatch:
    inputs:
      base_sha:
        description: Base commit for an automatic release dependency review
        type: string
      head_sha:
        description: Head commit for an automatic release dependency review
        type: string

permissions:
  contents: read

jobs:
  actions-security:
    name: Actions security lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          check-latest: true
          python-version: "3.15"
      - name: Install workflow security tools
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-ci.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
      - name: Audit GitHub Actions workflows
        run: zizmor .github/workflows

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request' || (inputs.base_sha != '' && inputs.head_sha != '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          head-ref: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown
          vulnerability-check: true
          license-check: true

  scorecard:
    name: OpenSSF Scorecard
    if: github.event_name != 'pull_request' && inputs.head_sha == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: scorecard-results.sarif
