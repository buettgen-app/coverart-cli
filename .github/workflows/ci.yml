name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          check-latest: true
          python-version: "3.15"
      - name: Check tracked files for PII and generated artifacts
        run: python scripts/check_repository.py

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          check-latest: true
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-ci.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: pyrefly check
      - name: Install FFmpeg test oracle
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version
      - name: Unit + integration tests
        run: |
          pytest --cov=coverart_cli --cov=scripts --cov-report=term-missing --cov-fail-under=87 \
            --cov-report=json:coverage-results/report.json \
            --cov-report=xml:coverage-results/coverage.xml \
            --cov-report=html:coverage-results/html
          python scripts/check_coverage.py coverage-results/report.json --profile common
      - name: Upload Linux coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-linux-${{ matrix.python-version }}
          path: coverage-results/
          if-no-files-found: error
          retention-days: 7

  windows-smoke:
    name: windows native (py${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          check-latest: true
          python-version: ${{ matrix.python-version }}
      - name: Install locked tools
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-ci.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
      - name: Install FFmpeg test oracle
        run: |
          $ffmpegReady = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -eq 0 -and (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
              $ffmpegReady = $true
              break
            }
            if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
          }
          if (-not $ffmpegReady) { throw "FFmpeg installation failed after three attempts" }
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify installed Windows wheel and console entry point
        run: |
          python -m build --wheel --no-isolation --outdir "$env:RUNNER_TEMP/coverart-wheel-dist"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m venv --system-site-packages "$env:RUNNER_TEMP/coverart-smoke"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $smokePython = "$env:RUNNER_TEMP/coverart-smoke/Scripts/python.exe"
          $wheel = (Get-ChildItem "$env:RUNNER_TEMP/coverart-wheel-dist/*.whl").FullName
          & $smokePython -m pip install --disable-pip-version-check --no-deps --force-reinstall $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/coverart-smoke/Scripts/coverart.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/coverart-smoke/Scripts/coverart.exe" --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "COVERART_SMOKE_PYTHON=$smokePython" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify platform-safe behavior
        run: |
          pytest tests/test_windows.py tests/test_tagging.py tests/test_cli.py tests/test_config.py tests/test_providers.py tests/test_security_boundaries.py tests/test_coverage_gate.py --cov=coverart_cli._windows_filesystem --cov-config=.github/windows-coverage.ini --cov-report=term-missing --cov-fail-under=80 --cov-report=json:coverage-results/report.json --cov-report=xml:coverage-results/coverage.xml --cov-report=html:coverage-results/html
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_coverage.py coverage-results/report.json --profile windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows backend coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-windows-${{ matrix.python-version }}
          path: coverage-results/
          if-no-files-found: error
          retention-days: 7

  macos-metadata:
    name: macOS metadata preservation
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          check-latest: true
          python-version: "3.15"
      - name: Install locked tools
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-ci.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
      - name: Install FFmpeg test oracle
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - name: Verify runtime and copy-on-write metadata contract
        run: |
          pytest tests/test_cli.py tests/test_config.py tests/test_tagging.py \
            tests/test_providers.py tests/test_report.py tests/test_integration.py \
            tests/test_filesystem.py tests/test_security_boundaries.py \
            tests/test_repository_hygiene.py tests/test_coverage_gate.py \
            tests/test_complete_release.py \
            --cov=coverart_cli --cov=scripts --cov-report=term-missing --cov-fail-under=87 \
            --cov-report=json:coverage-results/report.json \
            --cov-report=xml:coverage-results/coverage.xml \
            --cov-report=html:coverage-results/html
          python scripts/check_coverage.py coverage-results/report.json --profile common
      - name: Upload macOS coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-macos-3.15
          path: coverage-results/
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: smoke (install wheel + run end-to-end)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          check-latest: true
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Build wheel
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-build.txt
          python -m build --wheel --no-isolation
      - name: Install wheel into a fresh venv
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install --disable-pip-version-check dist/*.whl
      - name: Verify CLI is installed
        run: |
          /tmp/smoke-venv/bin/coverart --version
          /tmp/smoke-venv/bin/coverart --help > /dev/null
      - name: Build a fixture library
        # Use the smoke-venv python so we can import mutagen (installed as a dep of coverart-cli).
        run: |
          /tmp/smoke-venv/bin/python <<'PY'
          from pathlib import Path
          from mutagen.id3 import ID3, TPE1, TPE2, TALB, TIT2
          p = Path("/tmp/fixture-lib/Pink Floyd/The Wall/01.mp3")
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_bytes(b"\xff\xfb\x90\x00" + b"\x00" * 1000)
          tags = ID3()
          tags.add(TPE1(encoding=3, text=["Pink Floyd"]))
          tags.add(TPE2(encoding=3, text=["Pink Floyd"]))
          tags.add(TALB(encoding=3, text=["The Wall"]))
          tags.add(TIT2(encoding=3, text=["Mother"]))
          tags.save(str(p))
          PY
      - name: Run end-to-end
        run: |
          /tmp/smoke-venv/bin/python <<'PY'
          from pathlib import Path
          import io

          from PIL import Image

          from coverart_cli.core import RunOptions, run
          from coverart_cli.providers.base import CoverProvider, ProviderResult

          class FixtureProvider(CoverProvider):
              name = "fixture"
              user_agent = "coverart-cli-smoke/1.0"

              def fetch(self, artist, album):
                  output = io.BytesIO()
                  Image.effect_noise((128, 128), 100).convert("RGB").save(
                      output, format="JPEG", quality=90
                  )
                  image_bytes = output.getvalue()
                  return ProviderResult(
                      image_bytes=image_bytes,
                      source=self.name,
                      image_url="fixture://cover.jpg",
                  )

          stats = run(RunOptions(root=Path("/tmp/fixture-lib"), providers=[FixtureProvider()]))
          assert stats.fetched_from == {"fixture": 1}
          assert stats.files_embedded == 1
          PY
          test -f "/tmp/fixture-lib/Pink Floyd/The Wall/cover.jpg" && echo "✓ cover.jpg written"
      - name: Generate HTML report against fixture
        run: |
          /tmp/smoke-venv/bin/coverart /tmp/fixture-lib --report-only --report-html /tmp/report.html
          test -s /tmp/report.html && echo "✓ report written ($(wc -c </tmp/report.html) bytes)"

  attestation-lock:
    name: Dependency lock consistency
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          python-version: "3.11"
      - name: Verify canonical hash lock
        run: |
          uv pip compile requirements-attestation.in --python-version=3.11 --universal --generate-hashes --output-file=requirements-attestation.txt
          uv pip compile pyproject.toml --extra=dev requirements-build-backend.in --python-version=3.11 --universal --generate-hashes --output-file=requirements-ci.txt
          uv pip compile requirements-build.in --python-version=3.11 --universal --generate-hashes --output-file=requirements-build.txt
          uv pip compile requirements-fuzz.in --python-version=3.11 --universal --generate-hashes --output-file=requirements-fuzz.txt
          git diff --exit-code -- requirements-attestation.txt requirements-ci.txt requirements-build.txt requirements-fuzz.txt
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          check-latest: true
          python-version: "3.15"
      - name: Smoke-test locked verifier
        run: |
          python -m pip install --disable-pip-version-check \
            --only-binary=:all: --require-hashes -r requirements-attestation.txt
          pypi-attestations --help > /dev/null

  reproducible-artifacts:
    name: Reproducible wheel and sdist
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          check-latest: true
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install locked release tools
        run: |
          python -m pip install --disable-pip-version-check \
            --require-hashes -r requirements-build.txt
      - name: Build twice and compare exact artifacts
        env:
          SOURCE_DATE_EPOCH: "1580601600"
        run: |
          python -m build --no-isolation --outdir /tmp/repro-one
          python -m build --no-isolation --outdir /tmp/repro-two
          python - <<'PY'
          import hashlib
          from pathlib import Path

          def manifest(directory: str) -> list[tuple[str, str]]:
              return [
                  (artifact.name, hashlib.sha256(artifact.read_bytes()).hexdigest())
                  for artifact in sorted(Path(directory).iterdir())
                  if artifact.is_file()
              ]

          first = manifest("/tmp/repro-one")
          second = manifest("/tmp/repro-two")
          if len(first) != 2 or first != second:
              raise SystemExit("wheel and sdist builds are not reproducible")
          PY

  coverage:
    name: Coverage reports and gates
    needs: [test, windows-smoke, macos-metadata]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage-downloads/
      - name: Require every platform report and summarize measurements
        run: |
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          from scripts.check_coverage import check_report

          expected = {
              **{f"linux-{version}": "common" for version in ("3.11", "3.12", "3.13", "3.14", "3.15")},
              "windows-3.11": "windows",
              "windows-3.15": "windows",
              "macos-3.15": "common",
          }
          root = Path("coverage-downloads")
          if {p.name for p in root.iterdir()} != {f"coverage-{name}" for name in expected}:
              raise SystemExit("Coverage artifact set does not match the tested platform matrix")
          rows = ["## Test coverage", "", "| Platform | Measurement |", "| --- | --- |"]
          for platform, profile in expected.items():
              directory = root / f"coverage-{platform}"
              for filename in ("report.json", "coverage.xml", "html/index.html"):
                  if not (directory / filename).is_file():
                      raise SystemExit(f"Missing {platform} coverage artifact: {filename}")
              result = check_report(directory / "report.json", profile)
              rows.append(f"| {platform} | {result} |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("\n".join(rows) + "\n")
          PYCODE

  gate:
    name: CI gate
    if: always()
    needs:
      - repository-hygiene
      - test
      - windows-smoke
      - macos-metadata
      - smoke
      - attestation-lock
      - reproducible-artifacts
      - coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["JOB_RESULTS"])
          failed = [name for name, job in results.items() if job["result"] != "success"]
          if failed:
              print("Required CI jobs did not succeed: " + ", ".join(failed))
              sys.exit(1)
          print("All required CI jobs succeeded.")
          PY
