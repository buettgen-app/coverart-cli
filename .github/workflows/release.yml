name: Publish release

# PyPI includes this filename in the Trusted Publisher identity. Do not rename it.

on:
  repository_dispatch:
    types: [release-prepared]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to recover, including a draft, for example v1.2.3
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: publish-${{ github.event.client_payload.tag || github.event.inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.client_payload.tag || github.event.inputs.tag }}
  RELEASE_SHA: ${{ github.event.client_payload.sha || '' }}
  RELEASE_RUN_ID: ${{ github.event.client_payload.run_id || '' }}
  RELEASE_LOOKUP_JQ: >-
    [.[][] | select(.tag_name == $tag)] |
    if length == 1 then
      .[0] | {
        id: .id,
        draft: .draft,
        immutable: .immutable,
        prerelease: .prerelease,
        tag_name: .tag_name,
        target_commitish: .target_commitish,
        body: .body
      }
    elif length == 0 then
      error("release not found")
    else
      error("multiple releases found for tag")
    end
  DRAFT_RELEASE_JQ: >-
    (.id | tostring) == $id and
    .draft == true and
    .immutable == false and
    .prerelease == false and
    .tag_name == $tag and
    .target_commitish == $sha
  RECOVERABLE_RELEASE_JQ: >-
    (.id | tostring) == $id and
    .prerelease == false and
    .tag_name == $tag and
    ((.draft == true and
      .immutable == false and
      (.target_commitish == $old_sha or .target_commitish == $sha)) or
     (.draft == false and
      .immutable == true and
      .target_commitish == $sha))
  DRAFT_ASSETS_JQ: >-
    . as $release |
    ($release.assets | length) == ($assets | length) and
    all($assets[];
      . as $expected |
      [$release.assets[] |
        select(.name == $expected.name and
               .digest == $expected.digest and
               .state == "uploaded" and
               (.id | type) == "number")] |
      length == 1)
  EXACT_TAG_JQ: >-
    [.[] | select(.ref == $ref)] |
    if length == 1 then .[0]
    elif length == 0 then null
    else error("multiple exact tag refs found")
    end
  PYPI_EXISTING_JQ: >-
    (.info.version == $version) and
    ([.urls[] | {name: .filename, digest: .digests.sha256}] as $remote |
      ($remote | length) <= ($assets | length) and
      ($remote | map(.name) | length) ==
        ($remote | map(.name) | unique | length) and
      all($remote[];
        . as $existing |
        any($assets[];
          .name == $existing.name and .digest == $existing.digest)))
  PYPI_COMPLETE_JQ: >-
    (.info.version == $version) and
    ([.urls[] | {name: .filename, digest: .digests.sha256}] | sort_by(.name)) ==
      ($assets | sort_by(.name))

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      draft: ${{ steps.release.outputs.draft }}
      release_ref: ${{ steps.release.outputs.ref }}
      release_sha: ${{ steps.source.outputs.sha }}
      release_target: ${{ steps.release.outputs.target }}
    steps:
      - name: Validate internal publication dispatch
        if: github.event_name == 'repository_dispatch'
        run: |
          if [ "$GITHUB_ACTOR" != "github-actions[bot]" ]; then
            echo "::error::Publication dispatch must come from GitHub Actions."
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
             [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             [[ ! "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Publication dispatch must include a stable tag, full release SHA, and source run ID."
            exit 1
          fi
      - name: Verify publication source workflow
        if: github.event_name == 'repository_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID")"
          if ! jq -e \
            --arg sha "$RELEASE_SHA" \
            '.path == ".github/workflows/prepare-release.yml" and
             (.event == "push" or .event == "workflow_dispatch") and
             .head_branch == "main" and
             .head_sha == $sha' <<<"$source_run" >/dev/null; then
            echo "::error::Publication dispatch is not bound to the expected prepare-release run."
            exit 1
          fi
      - name: Restrict recovery runs to main
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Manual release recovery must run from main."
            exit 1
          fi
      - name: Verify GitHub release state
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must be a stable semantic version such as v1.2.3."
            exit 1
          fi

          release_pages="$(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100"
          )"
          release="$(
            jq -s --arg tag "$RELEASE_TAG" "$RELEASE_LOOKUP_JQ" \
              <<<"$release_pages"
          )"
          draft="$(jq -r .draft <<<"$release")"
          immutable="$(jq -r .immutable <<<"$release")"
          target_commitish="$(jq -r .target_commitish <<<"$release")"
          tag_refs="$(
            gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG"
          )"
          tag_ref="$(
            jq -c --arg ref "refs/tags/$RELEASE_TAG" \
              "$EXACT_TAG_JQ" <<<"$tag_refs"
          )"
          tag_sha=""
          if [ "$tag_ref" != "null" ]; then
            if [ "$(jq -r .object.type <<<"$tag_ref")" != "commit" ]; then
              echo "::error::$RELEASE_TAG must be a lightweight commit tag."
              exit 1
            fi
            tag_sha="$(jq -r .object.sha <<<"$tag_ref")"
            if [[ ! "$tag_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::$RELEASE_TAG does not resolve to a full commit SHA."
              exit 1
            fi
          fi

          if [ "$(jq -r .tag_name <<<"$release")" != "$RELEASE_TAG" ]; then
            echo "::error::Resolved release tag does not match $RELEASE_TAG."
            exit 1
          fi

          if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ]; then
            if [ "$draft" != "true" ] || [ "$immutable" != "false" ]; then
              echo "::error::$RELEASE_TAG must be a mutable draft before verified publication."
              exit 1
            fi
            if [ "$target_commitish" != "$RELEASE_SHA" ]; then
              echo "::error::$RELEASE_TAG does not target the dispatched release SHA."
              exit 1
            fi
            if [ -n "$tag_sha" ] && [ "$tag_sha" != "$RELEASE_SHA" ]; then
              echo "::error::$RELEASE_TAG already resolves to a different commit."
              exit 1
            fi
            release_ref="$RELEASE_SHA"
          elif [ "$draft" = "true" ]; then
            if [ "$immutable" != "false" ] ||
               [[ ! "$target_commitish" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Draft recovery requires a mutable release targeting a full commit SHA."
              exit 1
            fi
            if [ -n "$tag_sha" ]; then
              release_ref="$tag_sha"
            elif [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Manual recovery is not bound to a full main commit SHA."
              exit 1
            else
              release_ref="$GITHUB_SHA"
            fi
          else
            release_ref="$RELEASE_TAG"
          fi

          if [ -z "$release_ref" ]; then
            echo "::error::Release source ref could not be resolved."
            exit 1
          fi

          echo "id=$(jq -r .id <<<"$release")" >> "$GITHUB_OUTPUT"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          echo "ref=$release_ref" >> "$GITHUB_OUTPUT"
          echo "target=$target_commitish" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind release source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify dispatched release commit
        if: github.event_name == 'repository_dispatch'
        run: |
          if [ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]; then
            echo "::error::Dispatched release SHA does not match the published tag."
            exit 1
          fi
      - name: Verify mutable draft ancestry
        if: steps.release.outputs.draft == 'true'
        env:
          VALIDATED_DRAFT_TARGET: ${{ steps.release.outputs.target }}
        run: |
          if [[ ! "$VALIDATED_DRAFT_TARGET" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Mutable draft target is not a full commit SHA."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$VALIDATED_DRAFT_TARGET" HEAD; then
            echo "::error::Mutable draft target is not an ancestor of the verified release source."
            exit 1
          fi
          if ! git diff --quiet "$VALIDATED_DRAFT_TARGET" HEAD -- \
            . \
            ':(exclude).github/workflows/release.yml' \
            ':(exclude).github/workflows/ci.yml' \
            ':(exclude)tests/test_release_workflow.py' \
            ':(exclude)CHANGELOG.md' \
            ':(exclude)README.md'; then
            echo "::error::Release recovery includes changes outside the explicit release repair."
            git diff --name-only "$VALIDATED_DRAFT_TARGET" HEAD >&2
            exit 1
          fi
          if ! git diff --quiet HEAD origin/main -- .github/workflows; then
            echo "::error::Release source uses workflows that differ from current main."
            exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate tag and release metadata
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must be a stable semantic version such as v1.2.3."
            exit 1
          fi

          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release tag is not reachable from main."
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          python - "$version" <<'PY'
          import sys
          import tomllib
          from pathlib import Path

          expected = sys.argv[1]
          pyproject = tomllib.loads(Path("pyproject.toml").read_text())
          actual = pyproject["project"]["version"]
          if actual != expected:
              raise SystemExit(f"pyproject version {actual!r} does not match tag {expected!r}")

          init = Path("src/coverart_cli/__init__.py").read_text()
          if f'__version__ = "{expected}"' not in init:
              raise SystemExit("__version__ does not match the release tag")

          changelog = Path("CHANGELOG.md").read_text()
          if f"## [{expected}]" not in changelog:
              raise SystemExit("CHANGELOG.md does not contain this release")
          PY

  test:
    name: Release test (py${{ matrix.python-version }})
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.release_ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned development tools
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-ci.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
      - name: Verify tagged source
        run: |
          ruff check .
          pyrefly check
          pytest

  build:
    name: Build and verify release artifacts
    needs: [validate, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.release_ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked release tools
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-build.txt
      - name: Build wheel and source distribution
        if: needs.validate.outputs.draft == 'true'
        run: |
          python -m build --no-isolation
      - name: Download immutable release assets for recovery
        if: needs.validate.outputs.draft != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir dist
          gh release verify "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          for asset in dist/*; do
            gh release verify-asset "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY"
          done
      - name: Validate artifact set and metadata
        run: |
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l | tr -d ' ')" = "1"
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l | tr -d ' ')" = "1"
          python - <<'PY'
          import tarfile
          import zipfile
          import os
          from pathlib import Path

          from packaging.metadata import Metadata

          for artifact in Path("dist").iterdir():
              if artifact.suffix == ".whl":
                  with zipfile.ZipFile(artifact) as archive:
                      member = next(
                          name for name in archive.namelist()
                          if name.endswith(".dist-info/METADATA")
                      )
                      raw_metadata = archive.read(member)
              else:
                  with tarfile.open(artifact) as archive:
                      member = next(
                          item for item in archive.getmembers()
                          if item.name.endswith("/PKG-INFO")
                      )
                      extracted = archive.extractfile(member)
                      if extracted is None:
                          raise SystemExit(f"missing metadata in {artifact}")
                      raw_metadata = extracted.read()
              metadata = Metadata.from_email(raw_metadata, validate=True)
              if (
                  metadata.name != "coverart-cli"
                  or str(metadata.version) != os.environ["RELEASE_TAG"][1:]
              ):
                  raise SystemExit(f"unexpected metadata in {artifact}")
          PY
      - name: Verify wheel and source-distribution installations
        run: |
          version="${RELEASE_TAG#v}"
          for kind in wheel sdist; do
            python -m venv "/tmp/release-$kind"
            "/tmp/release-$kind/bin/pip" install \
              --disable-pip-version-check --require-hashes -r requirements-build.txt
            if [ "$kind" = wheel ]; then
              artifact=(dist/*.whl)
              extra=(--no-deps)
            else
              artifact=(dist/*.tar.gz)
              extra=(--no-deps --no-build-isolation)
            fi
            "/tmp/release-$kind/bin/pip" install --disable-pip-version-check \
              "${extra[@]}" "${artifact[0]}"
            test "$("/tmp/release-$kind/bin/coverart" --version)" = "coverart-cli $version"
            "/tmp/release-$kind/bin/coverart" --help > /dev/null
          done
      - name: Store release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ env.RELEASE_TAG }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  finalize:
    name: Finalize GitHub release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ env.RELEASE_TAG }}
          path: dist/
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.release_sha }}
          path: source
          persist-credentials: false
      - name: Resolve live release phase
        id: live
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.validate.outputs.release_id }}
          EXPECTED_RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
          VALIDATED_DRAFT_TARGET: ${{ needs.validate.outputs.release_target }}
        run: |
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          if ! jq -e \
            --arg id "$RELEASE_ID" \
            --arg tag "$RELEASE_TAG" \
            --arg old_sha "$VALIDATED_DRAFT_TARGET" \
            --arg sha "$EXPECTED_RELEASE_SHA" \
            "$RECOVERABLE_RELEASE_JQ" <<<"$release" >/dev/null; then
            echo "::error::$RELEASE_TAG is not in a recoverable live phase."
            exit 1
          fi
          echo "draft=$(jq -r .draft <<<"$release")" >> "$GITHUB_OUTPUT"
      - name: Bind mutable draft to exact verified source
        if: steps.live.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.validate.outputs.release_id }}
          EXPECTED_RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
          VALIDATED_DRAFT_TARGET: ${{ needs.validate.outputs.release_target }}
        run: |
          verify_workflow_identity() {
            local current_main="$1"
            if [ "$current_main" = "$EXPECTED_RELEASE_SHA" ]; then
              return 0
            fi
            expected_workflows="$(
              gh api --method GET \
                "repos/$GITHUB_REPOSITORY/contents/.github/workflows" \
                -f ref="$EXPECTED_RELEASE_SHA" \
                --jq 'sort_by(.name) | map({name, sha, type})'
            )"
            current_workflows="$(
              gh api --method GET \
                "repos/$GITHUB_REPOSITORY/contents/.github/workflows" \
                -f ref="$current_main" \
                --jq 'sort_by(.name) | map({name, sha, type})'
            )"
            if [ "$expected_workflows" != "$current_workflows" ]; then
              echo "::error::Release source workflows differ from current main."
              return 1
            fi
          }

          current_main="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha
          )"
          verify_workflow_identity "$current_main"

          version="${RELEASE_TAG#v}"
          release_body="$(python - "$version" <<'PY'
          import re
          import sys
          from pathlib import Path

          version = re.escape(sys.argv[1])
          changelog = Path("source/CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(rf"^## \[{version}\].*?(?=^## \[|\Z)", changelog, re.MULTILINE | re.DOTALL)
          if match is None:
              raise SystemExit("release changelog section not found")
          print(match.group(0).rstrip())
          PY
          )"

          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          if ! jq -e \
            --arg id "$RELEASE_ID" \
            --arg tag "$RELEASE_TAG" \
            --arg old_sha "$VALIDATED_DRAFT_TARGET" \
            --arg sha "$EXPECTED_RELEASE_SHA" \
            "$RECOVERABLE_RELEASE_JQ" <<<"$release" >/dev/null ||
             [ "$(jq -r .draft <<<"$release")" != "true" ]; then
            echo "::error::$RELEASE_TAG changed before source binding."
            exit 1
          fi

          rebound="$(
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -f tag_name="$RELEASE_TAG" \
              -f target_commitish="$EXPECTED_RELEASE_SHA" \
              -F prerelease=false \
              --raw-field body="$release_body" \
              -F draft=true
          )"
          if ! jq -e \
            --arg id "$RELEASE_ID" \
            --arg tag "$RELEASE_TAG" \
            --arg sha "$EXPECTED_RELEASE_SHA" \
            "$DRAFT_RELEASE_JQ" <<<"$rebound" >/dev/null; then
            echo "::error::GitHub did not bind the mutable draft to the verified source."
            exit 1
          fi
          if [ "$(jq -r .body <<<"$rebound")" != "$release_body" ]; then
            echo "::error::GitHub did not bind the draft release notes to the changelog."
            exit 1
          fi
      - name: Revalidate and upload draft assets by release ID
        if: steps.live.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.validate.outputs.release_id }}
          EXPECTED_RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
        run: |
          if [[ ! "$RELEASE_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Release ID is not numeric."
            exit 1
          fi

          for asset_path in dist/*; do
            asset_name="$(basename "$asset_path")"
            local_digest="sha256:$(sha256sum "$asset_path" | cut -d' ' -f1)"
            release="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
            if ! jq -e \
              --arg id "$RELEASE_ID" \
              --arg tag "$RELEASE_TAG" \
              --arg sha "$EXPECTED_RELEASE_SHA" \
              "$DRAFT_RELEASE_JQ" <<<"$release" >/dev/null; then
              echo "::error::$RELEASE_TAG changed before asset upload."
              exit 1
            fi

            existing="$(
              jq -c --arg name "$asset_name" \
                '[.assets[] | select(.name == $name)]' <<<"$release"
            )"
            if [ "$(jq 'length' <<<"$existing")" -gt 1 ]; then
              echo "::error::$RELEASE_TAG contains duplicate assets named $asset_name."
              exit 1
            fi
            if [ "$(jq 'length' <<<"$existing")" -eq 1 ]; then
              if [ "$(jq -r '.[0].digest' <<<"$existing")" = "$local_digest" ]; then
                continue
              fi
              existing_id="$(jq -r '.[0].id' <<<"$existing")"
              if [[ ! "$existing_id" =~ ^[0-9]+$ ]]; then
                echo "::error::Existing release asset ID is not numeric."
                exit 1
              fi
              gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/releases/assets/$existing_id"
            fi

            encoded_name="$(jq -nr --arg name "$asset_name" '$name | @uri')"
            uploaded="$(
              curl --fail-with-body --silent --show-error \
                --request POST \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header "Content-Type: application/octet-stream" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                --data-binary "@$asset_path" \
                "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$encoded_name"
            )"
            if ! jq -e --arg name "$asset_name" \
              '.name == $name and .state == "uploaded"' <<<"$uploaded" >/dev/null; then
              echo "::error::GitHub did not accept release asset $asset_name."
              exit 1
            fi
          done
      - name: Bind tag and publish exact verified draft release
        if: steps.live.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.validate.outputs.release_id }}
          EXPECTED_RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
        run: |
          verify_workflow_identity() {
            local current_main="$1"
            if [ "$current_main" = "$EXPECTED_RELEASE_SHA" ]; then
              return 0
            fi
            expected_workflows="$(
              gh api --method GET \
                "repos/$GITHUB_REPOSITORY/contents/.github/workflows" \
                -f ref="$EXPECTED_RELEASE_SHA" \
                --jq 'sort_by(.name) | map({name, sha, type})'
            )"
            current_workflows="$(
              gh api --method GET \
                "repos/$GITHUB_REPOSITORY/contents/.github/workflows" \
                -f ref="$current_main" \
                --jq 'sort_by(.name) | map({name, sha, type})'
            )"
            if [ "$expected_workflows" != "$current_workflows" ]; then
              echo "::error::Release source workflows differ from current main."
              return 1
            fi
          }

          version="${RELEASE_TAG#v}"
          release_body="$(python - "$version" <<'PY'
          import re
          import sys
          from pathlib import Path

          version = re.escape(sys.argv[1])
          changelog = Path("source/CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(rf"^## \[{version}\].*?(?=^## \[|\Z)", changelog, re.MULTILINE | re.DOTALL)
          if match is None:
              raise SystemExit("release changelog section not found")
          print(match.group(0).rstrip())
          PY
          )"

          expected_assets='[]'
          for asset_path in dist/*; do
            asset_name="$(basename "$asset_path")"
            asset_digest="sha256:$(sha256sum "$asset_path" | cut -d' ' -f1)"
            expected_assets="$(
              jq -c \
                --arg name "$asset_name" \
                --arg digest "$asset_digest" \
                '. + [{name: $name, digest: $digest}]' \
                <<<"$expected_assets"
            )"
          done
          if [ "$(jq 'length' <<<"$expected_assets")" -ne 2 ]; then
            echo "::error::Expected exactly one wheel and one source distribution."
            exit 1
          fi

          validate_draft_release() {
            local release_json="$1"
            if ! jq -e \
              --arg id "$RELEASE_ID" \
              --arg tag "$RELEASE_TAG" \
              --arg sha "$EXPECTED_RELEASE_SHA" \
              "$DRAFT_RELEASE_JQ" <<<"$release_json" >/dev/null; then
              echo "::error::$RELEASE_TAG changed before publication; leaving it unpublished."
              return 1
            fi
            if [ "$(jq -r .body <<<"$release_json")" != "$release_body" ]; then
              echo "::error::$RELEASE_TAG notes do not match the release changelog."
              return 1
            fi
            if ! jq -e \
              --argjson assets "$expected_assets" \
              "$DRAFT_ASSETS_JQ" <<<"$release_json" >/dev/null; then
              echo "::error::$RELEASE_TAG assets do not match the exact verified build."
              return 1
            fi
          }

          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          validate_draft_release "$release"

          current_main="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha
          )"
          verify_workflow_identity "$current_main"

          tag_create_error="$RUNNER_TEMP/tag-create-error"
          if ! gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" \
            -f sha="$EXPECTED_RELEASE_SHA" \
            > /dev/null 2>"$tag_create_error"; then
            existing_refs="$(
              gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG"
            )"
            existing_ref="$(
              jq -c --arg ref "refs/tags/$RELEASE_TAG" \
                "$EXACT_TAG_JQ" <<<"$existing_refs"
            )"
            if [ "$existing_ref" = "null" ]; then
              cat "$tag_create_error" >&2
              exit 1
            fi
          fi
          verify_release_tag() {
            local refs exact_ref
            refs="$(
              gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG"
            )"
            exact_ref="$(
              jq -c --arg ref "refs/tags/$RELEASE_TAG" \
                "$EXACT_TAG_JQ" <<<"$refs"
            )"
            if [ "$exact_ref" = "null" ]; then
              echo "::error::Exact release tag is missing."
              return 1
            fi
            if [ "$(jq -r .object.type <<<"$exact_ref")" != "commit" ] ||
               [ "$(jq -r .object.sha <<<"$exact_ref")" != "$EXPECTED_RELEASE_SHA" ]; then
              echo "::error::$RELEASE_TAG is not bound to $EXPECTED_RELEASE_SHA."
              return 1
            fi
          }
          verify_release_tag

          current_main="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha
          )"
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          verify_workflow_identity "$current_main"
          validate_draft_release "$release"
          verify_release_tag

          published="$(
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -f tag_name="$RELEASE_TAG" \
              -f target_commitish="$EXPECTED_RELEASE_SHA" \
              -F prerelease=false \
              --raw-field body="$release_body" \
              -F draft=false
          )"
          if ! jq -e \
            --arg id "$RELEASE_ID" \
            --arg tag "$RELEASE_TAG" \
            --arg sha "$EXPECTED_RELEASE_SHA" \
            --arg body "$release_body" \
            '(.id | tostring) == $id and
             .draft == false and
             .prerelease == false and
             .tag_name == $tag and
             .target_commitish == $sha and
             .body == $body' <<<"$published" >/dev/null; then
            echo "::error::GitHub did not publish the expected release state."
            exit 1
          fi
          if ! jq -e \
            --argjson assets "$expected_assets" \
            "$DRAFT_ASSETS_JQ" <<<"$published" >/dev/null; then
            echo "::error::Published assets differ from the verified build."
            exit 1
          fi
      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.validate.outputs.release_id }}
          EXPECTED_RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
        run: |
          version="${RELEASE_TAG#v}"
          release_body="$(python - "$version" <<'PY'
          import re
          import sys
          from pathlib import Path

          version = re.escape(sys.argv[1])
          changelog = Path("source/CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(rf"^## \[{version}\].*?(?=^## \[|\Z)", changelog, re.MULTILINE | re.DOTALL)
          if match is None:
              raise SystemExit("release changelog section not found")
          print(match.group(0).rstrip())
          PY
          )"
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          if ! jq -e \
            --arg id "$RELEASE_ID" \
            --arg tag "$RELEASE_TAG" \
            --arg sha "$EXPECTED_RELEASE_SHA" \
            --arg body "$release_body" \
            '(.id | tostring) == $id and
             .draft == false and
             .immutable == true and
             .prerelease == false and
             .tag_name == $tag and
             .target_commitish == $sha and
             .body == $body' <<<"$release" >/dev/null; then
            echo "::error::$RELEASE_TAG is not the expected immutable published release."
            exit 1
          fi

          if [ "$(jq '.assets | length' <<<"$release")" -ne 2 ]; then
            echo "::error::$RELEASE_TAG does not contain the verified wheel and source distribution."
            exit 1
          fi

          gh release verify "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          for asset in dist/*; do
            gh release verify-asset "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY"
          done

          tag_refs="$(
            gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG"
          )"
          tag_ref="$(
            jq -c --arg ref "refs/tags/$RELEASE_TAG" \
              "$EXACT_TAG_JQ" <<<"$tag_refs"
          )"
          if [ "$tag_ref" = "null" ] ||
             [ "$(jq -r .object.type <<<"$tag_ref")" != "commit" ] ||
             [ "$(jq -r .object.sha <<<"$tag_ref")" != "$EXPECTED_RELEASE_SHA" ]; then
            echo "::error::$RELEASE_TAG is not bound to $EXPECTED_RELEASE_SHA; refusing PyPI publication."
            exit 1
          fi

  publish:
    name: Publish to PyPI
    needs: finalize
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/coverart-cli/
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ env.RELEASE_TAG }}
          path: dist/
      - name: Plan idempotent PyPI upload
        id: pypi
        run: |
          version="${RELEASE_TAG#v}"
          mkdir pypi-dist
          expected_assets='[]'
          for asset_path in dist/*; do
            asset_name="$(basename "$asset_path")"
            asset_digest="$(sha256sum "$asset_path" | cut -d' ' -f1)"
            expected_assets="$(
              jq -c \
                --arg name "$asset_name" \
                --arg digest "$asset_digest" \
                '. + [{name: $name, digest: $digest}]' \
                <<<"$expected_assets"
            )"
          done
          if [ "$(jq 'length' <<<"$expected_assets")" -ne 2 ]; then
            echo "::error::Expected exactly one wheel and one source distribution for PyPI."
            exit 1
          fi
          printf '%s\n' "$expected_assets" > "$RUNNER_TEMP/expected-pypi-assets.json"

          response="$RUNNER_TEMP/pypi-release.json"
          status="$(
            curl --silent --show-error --location \
              --output "$response" \
              --write-out '%{http_code}' \
              "https://pypi.org/pypi/coverart-cli/$version/json"
          )"
          if [ "$status" = "404" ]; then
            remote_assets='[]'
          elif [ "$status" = "200" ]; then
            if ! jq -e \
              --arg version "$version" \
              --argjson assets "$expected_assets" \
              "$PYPI_EXISTING_JQ" "$response" >/dev/null; then
              echo "::error::Existing PyPI files do not match the verified release artifacts."
              exit 1
            fi
            remote_assets="$(
              jq -c '[.urls[] | {name: .filename, digest: .digests.sha256}]' \
                "$response"
            )"
          else
            echo "::error::PyPI release lookup returned HTTP $status."
            exit 1
          fi

          for asset_path in dist/*; do
            asset_name="$(basename "$asset_path")"
            if jq -e --arg name "$asset_name" \
              'any(.[]; .name == $name)' <<<"$remote_assets" >/dev/null; then
              continue
            fi
            cp -- "$asset_path" pypi-dist/
          done
          missing="$(find pypi-dist -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [ "$missing" -gt 0 ]; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "upload=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish missing distributions to PyPI
        if: steps.pypi.outputs.upload == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: pypi-dist/
          attestations: true
      - name: Verify PyPI files and attestations
        run: |
          version="${RELEASE_TAG#v}"
          expected_assets="$(cat "$RUNNER_TEMP/expected-pypi-assets.json")"
          response="$RUNNER_TEMP/pypi-release-final.json"
          complete=false
          for attempt in {1..12}; do
            if ! status="$(
              curl --silent --show-error --location \
                --output "$response" \
                --write-out '%{http_code}' \
                "https://pypi.org/pypi/coverart-cli/$version/json"
            )"; then
              status=000
            fi
            if [ "$status" = "200" ] && jq -e \
              --arg version "$version" \
              --argjson assets "$expected_assets" \
              "$PYPI_COMPLETE_JQ" "$response" >/dev/null; then
              complete=true
              break
            fi
            sleep 5
          done
          if [ "$complete" != "true" ]; then
            echo "::error::PyPI did not expose the exact verified artifact set."
            exit 1
          fi

          for asset_path in dist/*; do
            asset_name="$(basename "$asset_path")"
            asset_digest="$(sha256sum "$asset_path" | cut -d' ' -f1)"
            encoded_name="$(jq -nr --arg name "$asset_name" '$name | @uri')"
            provenance="$RUNNER_TEMP/provenance-$encoded_name.json"
            attested=false
            for attempt in {1..12}; do
              if ! status="$(
                curl --silent --show-error --location \
                  --header 'Accept: application/vnd.pypi.integrity.v1+json' \
                  --output "$provenance" \
                  --write-out '%{http_code}' \
                  "https://pypi.org/integrity/coverart-cli/$version/$encoded_name/provenance"
              )"; then
                status=000
              fi
              if [ "$status" = "200" ] && jq -e \
                --arg name "$asset_name" \
                --arg digest "$asset_digest" \
                '[.attestation_bundles[]?.attestations[]? |
                 (.envelope.statement | @base64d | fromjson) as $statement |
                 $statement.subject[]? |
                 select(.name == $name and .digest.sha256 == $digest)] |
                 length > 0' "$provenance" >/dev/null; then
                attested=true
                break
              fi
              sleep 5
            done
            if [ "$attested" != "true" ]; then
              echo "::error::PyPI provenance is missing for $asset_name."
              exit 1
            fi
          done
