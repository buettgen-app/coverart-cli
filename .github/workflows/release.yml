name: Publish release

# PyPI includes this filename in the Trusted Publisher identity. Do not rename it.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag to recover, for example v1.2.3
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name || github.event.inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - name: Restrict recovery runs to main
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Manual release recovery must run from main."
            exit 1
          fi
      - name: Verify published GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .draft)"
          if [ "$draft" != "false" ]; then
            echo "::error::$RELEASE_TAG is not a published GitHub Release."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate tag and release metadata
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must be a stable semantic version such as v1.2.3."
            exit 1
          fi

          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release tag is not reachable from main."
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          python - "$version" <<'PY'
          import sys
          import tomllib
          from pathlib import Path

          expected = sys.argv[1]
          pyproject = tomllib.loads(Path("pyproject.toml").read_text())
          actual = pyproject["project"]["version"]
          if actual != expected:
              raise SystemExit(f"pyproject version {actual!r} does not match tag {expected!r}")

          init = Path("src/coverart_cli/__init__.py").read_text()
          if f'__version__ = "{expected}"' not in init:
              raise SystemExit("__version__ does not match the release tag")

          changelog = Path("CHANGELOG.md").read_text()
          if f"## [{expected}]" not in changelog:
              raise SystemExit("CHANGELOG.md does not contain this release")
          PY

  test:
    name: Release test (py${{ matrix.python-version }})
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned development tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Verify tagged source
        run: |
          ruff check .
          pyrefly check
          pytest

  build:
    name: Build and verify release artifacts
    needs: [validate, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build wheel and source distribution
        run: |
          python -m pip install --disable-pip-version-check build==1.5.1
          python -m build
      - name: Verify wheel installation
        run: |
          python -m venv /tmp/release-venv
          /tmp/release-venv/bin/pip install --disable-pip-version-check dist/*.whl
          version="${RELEASE_TAG#v}"
          test "$(/tmp/release-venv/bin/coverart --version)" = "coverart-cli $version"
          /tmp/release-venv/bin/coverart --help > /dev/null
      - name: Validate artifact set
        run: |
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l | tr -d ' ')" = "1"
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l | tr -d ' ')" = "1"
      - name: Store release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ env.RELEASE_TAG }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  attach:
    name: Attach artifacts to GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ env.RELEASE_TAG }}
          path: dist/
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    name: Publish to PyPI
    needs: attach
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/coverart-cli/
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ env.RELEASE_TAG }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: dist/
          attestations: true
