name: Publish release

# PyPI includes this filename in the Trusted Publisher identity. Do not rename it.

on:
  repository_dispatch:
    types: [release-prepared]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag to recover, for example v1.2.3
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: publish-${{ github.event.client_payload.tag || github.event.inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.client_payload.tag || github.event.inputs.tag }}
  RELEASE_SHA: ${{ github.event.client_payload.sha || '' }}
  RELEASE_RUN_ID: ${{ github.event.client_payload.run_id || '' }}
  RELEASE_REF: ${{ github.event.client_payload.sha || github.event.inputs.tag }}

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      draft: ${{ steps.release.outputs.draft }}
    steps:
      - name: Validate internal publication dispatch
        if: github.event_name == 'repository_dispatch'
        run: |
          if [ "$GITHUB_ACTOR" != "github-actions[bot]" ]; then
            echo "::error::Publication dispatch must come from GitHub Actions."
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
             [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             [[ ! "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Publication dispatch must include a stable tag, full release SHA, and source run ID."
            exit 1
          fi
      - name: Verify publication source workflow
        if: github.event_name == 'repository_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID")"
          if ! jq -e \
            --arg sha "$RELEASE_SHA" \
            '.path == ".github/workflows/prepare-release.yml" and
             (.event == "push" or .event == "workflow_dispatch") and
             .head_branch == "main" and
             .head_sha == $sha' <<<"$source_run" >/dev/null; then
            echo "::error::Publication dispatch is not bound to the expected prepare-release run."
            exit 1
          fi
      - name: Restrict recovery runs to main
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Manual release recovery must run from main."
            exit 1
          fi
      - name: Verify GitHub release state
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          draft="$(jq -r .draft <<<"$release")"
          immutable="$(jq -r '.immutable // false' <<<"$release")"

          if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ]; then
            if [ "$draft" != "true" ] || [ "$immutable" != "false" ]; then
              echo "::error::$RELEASE_TAG must be a mutable draft before verified publication."
              exit 1
            fi
          elif [ "$draft" != "false" ]; then
            echo "::error::Manual recovery requires an existing published release."
            exit 1
          fi

          echo "id=$(jq -r .id <<<"$release")" >> "$GITHUB_OUTPUT"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify dispatched release commit
        if: github.event_name == 'repository_dispatch'
        run: |
          if [ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]; then
            echo "::error::Dispatched release SHA does not match the published tag."
            exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate tag and release metadata
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must be a stable semantic version such as v1.2.3."
            exit 1
          fi

          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release tag is not reachable from main."
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          python - "$version" <<'PY'
          import sys
          import tomllib
          from pathlib import Path

          expected = sys.argv[1]
          pyproject = tomllib.loads(Path("pyproject.toml").read_text())
          actual = pyproject["project"]["version"]
          if actual != expected:
              raise SystemExit(f"pyproject version {actual!r} does not match tag {expected!r}")

          init = Path("src/coverart_cli/__init__.py").read_text()
          if f'__version__ = "{expected}"' not in init:
              raise SystemExit("__version__ does not match the release tag")

          changelog = Path("CHANGELOG.md").read_text()
          if f"## [{expected}]" not in changelog:
              raise SystemExit("CHANGELOG.md does not contain this release")
          PY

  test:
    name: Release test (py${{ matrix.python-version }})
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned development tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Verify tagged source
        run: |
          ruff check .
          pyrefly check
          pytest

  build:
    name: Build and verify release artifacts
    needs: [validate, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build wheel and source distribution
        run: |
          python -m pip install --disable-pip-version-check build==1.5.0
          python -m build
      - name: Verify wheel installation
        run: |
          python -m venv /tmp/release-venv
          /tmp/release-venv/bin/pip install --disable-pip-version-check dist/*.whl
          version="${RELEASE_TAG#v}"
          test "$(/tmp/release-venv/bin/coverart --version)" = "coverart-cli $version"
          /tmp/release-venv/bin/coverart --help > /dev/null
      - name: Validate artifact set
        run: |
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l | tr -d ' ')" = "1"
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l | tr -d ' ')" = "1"
      - name: Store release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ env.RELEASE_TAG }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  finalize:
    name: Finalize GitHub release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ env.RELEASE_TAG }}
          path: dist/
      - name: Upload release assets
        if: needs.validate.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
      - name: Validate draft release assets
        if: needs.validate.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.validate.outputs.release_id }}
        run: |
          expected_assets="$(find dist -maxdepth 1 -type f -printf '%f\n' | sort)"
          actual_assets="$(
            gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" |
              jq -r '.assets[].name' |
              sort
          )"
          if [ "$(printf '%s\n' "$expected_assets" | sed '/^$/d' | wc -l | tr -d ' ')" -ne 2 ] ||
             [ "$actual_assets" != "$expected_assets" ]; then
            echo "::error::$RELEASE_TAG contains unexpected or missing release assets; leaving it as a mutable draft."
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected_assets" "$actual_assets"
            exit 1
          fi
      - name: Publish draft release
        if: needs.validate.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.validate.outputs.release_id }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false > /dev/null
      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_WAS_DRAFT: ${{ needs.validate.outputs.draft }}
        run: |
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          if [ "$(jq -r .draft <<<"$release")" != "false" ]; then
            echo "::error::$RELEASE_TAG was not published."
            exit 1
          fi

          if [ "$RELEASE_WAS_DRAFT" = "true" ] &&
             [ "$(jq '.assets | length' <<<"$release")" -ne 2 ]; then
            echo "::error::$RELEASE_TAG does not contain the verified wheel and source distribution."
            exit 1
          fi

  publish:
    name: Publish to PyPI
    needs: finalize
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/coverart-cli/
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ env.RELEASE_TAG }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          attestations: true
