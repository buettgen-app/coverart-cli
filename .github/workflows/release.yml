name: Publish release

# PyPI includes this filename in the Trusted Publisher identity. Do not rename it.

on:
  repository_dispatch:
    types: [release-prepared]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to recover, including a draft, for example v1.2.3
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: publish-${{ github.event.client_payload.tag || github.event.inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.client_payload.tag || github.event.inputs.tag }}
  RELEASE_SHA: ${{ github.event.client_payload.sha || '' }}
  RELEASE_RUN_ID: ${{ github.event.client_payload.run_id || '' }}
  RELEASE_LOOKUP_JQ: >-
    [.[][] | select(.tag_name == $tag)] |
    if length == 1 then
      .[0] | {
        id: .id,
        draft: .draft,
        immutable: .immutable,
        tag_name: .tag_name,
        target_commitish: .target_commitish
      }
    elif length == 0 then
      error("release not found")
    else
      error("multiple releases found for tag")
    end
  DRAFT_RELEASE_JQ: >-
    (.id | tostring) == $id and
    .draft == true and
    .immutable == false and
    .tag_name == $tag and
    .target_commitish == $sha

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      draft: ${{ steps.release.outputs.draft }}
      release_ref: ${{ steps.release.outputs.ref }}
      release_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate internal publication dispatch
        if: github.event_name == 'repository_dispatch'
        run: |
          if [ "$GITHUB_ACTOR" != "github-actions[bot]" ]; then
            echo "::error::Publication dispatch must come from GitHub Actions."
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
             [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             [[ ! "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Publication dispatch must include a stable tag, full release SHA, and source run ID."
            exit 1
          fi
      - name: Verify publication source workflow
        if: github.event_name == 'repository_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID")"
          if ! jq -e \
            --arg sha "$RELEASE_SHA" \
            '.path == ".github/workflows/prepare-release.yml" and
             (.event == "push" or .event == "workflow_dispatch") and
             .head_branch == "main" and
             .head_sha == $sha' <<<"$source_run" >/dev/null; then
            echo "::error::Publication dispatch is not bound to the expected prepare-release run."
            exit 1
          fi
      - name: Restrict recovery runs to main
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Manual release recovery must run from main."
            exit 1
          fi
      - name: Verify GitHub release state
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must be a stable semantic version such as v1.2.3."
            exit 1
          fi

          release_pages="$(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100"
          )"
          release="$(
            jq -s --arg tag "$RELEASE_TAG" "$RELEASE_LOOKUP_JQ" \
              <<<"$release_pages"
          )"
          draft="$(jq -r .draft <<<"$release")"
          immutable="$(jq -r .immutable <<<"$release")"
          target_commitish="$(jq -r .target_commitish <<<"$release")"

          if [ "$(jq -r .tag_name <<<"$release")" != "$RELEASE_TAG" ]; then
            echo "::error::Resolved release tag does not match $RELEASE_TAG."
            exit 1
          fi

          if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ]; then
            if [ "$draft" != "true" ] || [ "$immutable" != "false" ]; then
              echo "::error::$RELEASE_TAG must be a mutable draft before verified publication."
              exit 1
            fi
            if [ "$target_commitish" != "$RELEASE_SHA" ]; then
              echo "::error::$RELEASE_TAG does not target the dispatched release SHA."
              exit 1
            fi
            release_ref="$RELEASE_SHA"
          elif [ "$draft" = "true" ]; then
            if [ "$immutable" != "false" ] ||
               [[ ! "$target_commitish" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Draft recovery requires a mutable release targeting a full commit SHA."
              exit 1
            fi
            release_ref="$target_commitish"
          else
            release_ref="$RELEASE_TAG"
          fi

          if [ -z "$release_ref" ]; then
            echo "::error::Release source ref could not be resolved."
            exit 1
          fi

          echo "id=$(jq -r .id <<<"$release")" >> "$GITHUB_OUTPUT"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          echo "ref=$release_ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind release source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify dispatched release commit
        if: github.event_name == 'repository_dispatch'
        run: |
          if [ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]; then
            echo "::error::Dispatched release SHA does not match the published tag."
            exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate tag and release metadata
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must be a stable semantic version such as v1.2.3."
            exit 1
          fi

          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release tag is not reachable from main."
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          python - "$version" <<'PY'
          import sys
          import tomllib
          from pathlib import Path

          expected = sys.argv[1]
          pyproject = tomllib.loads(Path("pyproject.toml").read_text())
          actual = pyproject["project"]["version"]
          if actual != expected:
              raise SystemExit(f"pyproject version {actual!r} does not match tag {expected!r}")

          init = Path("src/coverart_cli/__init__.py").read_text()
          if f'__version__ = "{expected}"' not in init:
              raise SystemExit("__version__ does not match the release tag")

          changelog = Path("CHANGELOG.md").read_text()
          if f"## [{expected}]" not in changelog:
              raise SystemExit("CHANGELOG.md does not contain this release")
          PY

  test:
    name: Release test (py${{ matrix.python-version }})
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.release_ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned development tools
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-ci.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
      - name: Verify tagged source
        run: |
          ruff check .
          pyrefly check
          pytest

  build:
    name: Build and verify release artifacts
    needs: [validate, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.release_ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked release tools
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-build.txt
      - name: Build wheel and source distribution
        if: needs.validate.outputs.draft == 'true'
        run: |
          python -m build --no-isolation
      - name: Download immutable release assets for recovery
        if: needs.validate.outputs.draft != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir dist
          gh release verify "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          for asset in dist/*; do
            gh release verify-asset "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY"
          done
      - name: Validate artifact set and metadata
        run: |
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l | tr -d ' ')" = "1"
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l | tr -d ' ')" = "1"
          python - <<'PY'
          import tarfile
          import zipfile
          import os
          from pathlib import Path

          from packaging.metadata import Metadata

          for artifact in Path("dist").iterdir():
              if artifact.suffix == ".whl":
                  with zipfile.ZipFile(artifact) as archive:
                      member = next(
                          name for name in archive.namelist()
                          if name.endswith(".dist-info/METADATA")
                      )
                      raw_metadata = archive.read(member)
              else:
                  with tarfile.open(artifact) as archive:
                      member = next(
                          item for item in archive.getmembers()
                          if item.name.endswith("/PKG-INFO")
                      )
                      extracted = archive.extractfile(member)
                      if extracted is None:
                          raise SystemExit(f"missing metadata in {artifact}")
                      raw_metadata = extracted.read()
              metadata = Metadata.from_email(raw_metadata, validate=True)
              if (
                  metadata.name != "coverart-cli"
                  or str(metadata.version) != os.environ["RELEASE_TAG"][1:]
              ):
                  raise SystemExit(f"unexpected metadata in {artifact}")
          PY
      - name: Verify wheel and source-distribution installations
        run: |
          version="${RELEASE_TAG#v}"
          for kind in wheel sdist; do
            python -m venv "/tmp/release-$kind"
            "/tmp/release-$kind/bin/pip" install \
              --disable-pip-version-check --require-hashes -r requirements-build.txt
            if [ "$kind" = wheel ]; then
              artifact=(dist/*.whl)
              extra=(--no-deps)
            else
              artifact=(dist/*.tar.gz)
              extra=(--no-deps --no-build-isolation)
            fi
            "/tmp/release-$kind/bin/pip" install --disable-pip-version-check \
              "${extra[@]}" "${artifact[0]}"
            test "$("/tmp/release-$kind/bin/coverart" --version)" = "coverart-cli $version"
            "/tmp/release-$kind/bin/coverart" --help > /dev/null
          done
      - name: Store release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ env.RELEASE_TAG }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  finalize:
    name: Finalize GitHub release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ env.RELEASE_TAG }}
          path: dist/
      - name: Revalidate and upload draft assets by release ID
        if: needs.validate.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.validate.outputs.release_id }}
          EXPECTED_RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
        run: |
          if [[ ! "$RELEASE_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Release ID is not numeric."
            exit 1
          fi

          for asset_path in dist/*; do
            asset_name="$(basename "$asset_path")"
            local_digest="sha256:$(sha256sum "$asset_path" | cut -d' ' -f1)"
            release="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
            if ! jq -e \
              --arg id "$RELEASE_ID" \
              --arg tag "$RELEASE_TAG" \
              --arg sha "$EXPECTED_RELEASE_SHA" \
              "$DRAFT_RELEASE_JQ" <<<"$release" >/dev/null; then
              echo "::error::$RELEASE_TAG changed before asset upload."
              exit 1
            fi

            existing="$(
              jq -c --arg name "$asset_name" \
                '[.assets[] | select(.name == $name)]' <<<"$release"
            )"
            if [ "$(jq 'length' <<<"$existing")" -gt 1 ]; then
              echo "::error::$RELEASE_TAG contains duplicate assets named $asset_name."
              exit 1
            fi
            if [ "$(jq 'length' <<<"$existing")" -eq 1 ]; then
              if [ "$(jq -r '.[0].digest' <<<"$existing")" = "$local_digest" ]; then
                continue
              fi
              existing_id="$(jq -r '.[0].id' <<<"$existing")"
              if [[ ! "$existing_id" =~ ^[0-9]+$ ]]; then
                echo "::error::Existing release asset ID is not numeric."
                exit 1
              fi
              gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/releases/assets/$existing_id"
            fi

            encoded_name="$(jq -nr --arg name "$asset_name" '$name | @uri')"
            uploaded="$(
              curl --fail-with-body --silent --show-error \
                --request POST \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header "Content-Type: application/octet-stream" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                --data-binary "@$asset_path" \
                "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$encoded_name"
            )"
            if ! jq -e --arg name "$asset_name" \
              '.name == $name and .state == "uploaded"' <<<"$uploaded" >/dev/null; then
              echo "::error::GitHub did not accept release asset $asset_name."
              exit 1
            fi
          done
      - name: Validate draft release assets
        if: needs.validate.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.validate.outputs.release_id }}
        run: |
          expected_assets="$(find dist -maxdepth 1 -type f -printf '%f\n' | sort)"
          actual_assets="$(
            gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" |
              jq -r '.assets[].name' |
              sort
          )"
          if [ "$(printf '%s\n' "$expected_assets" | sed '/^$/d' | wc -l | tr -d ' ')" -ne 2 ] ||
             [ "$actual_assets" != "$expected_assets" ]; then
            echo "::error::$RELEASE_TAG contains unexpected or missing release assets; leaving it as a mutable draft."
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected_assets" "$actual_assets"
            exit 1
          fi

          while IFS= read -r asset; do
            local_digest="sha256:$(sha256sum "dist/$asset" | cut -d' ' -f1)"
            remote_digest="$(
              gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
                --jq ".assets[] | select(.name == \"$asset\") | .digest"
            )"
            if [ "$remote_digest" != "$local_digest" ]; then
              echo "::error::$asset digest does not match its GitHub release asset."
              exit 1
            fi
          done <<<"$expected_assets"
      - name: Revalidate and publish exact draft release
        if: needs.validate.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.validate.outputs.release_id }}
          EXPECTED_RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
        run: |
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          if ! jq -e \
            --arg id "$RELEASE_ID" \
            --arg tag "$RELEASE_TAG" \
            --arg sha "$EXPECTED_RELEASE_SHA" \
            "$DRAFT_RELEASE_JQ" <<<"$release" >/dev/null; then
            echo "::error::$RELEASE_TAG changed before publication; leaving it unpublished."
            exit 1
          fi

          published="$(
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -f tag_name="$RELEASE_TAG" \
              -f target_commitish="$EXPECTED_RELEASE_SHA" \
              -F draft=false
          )"
          if ! jq -e \
            --arg id "$RELEASE_ID" \
            --arg tag "$RELEASE_TAG" \
            --arg sha "$EXPECTED_RELEASE_SHA" \
            '(.id | tostring) == $id and
             .draft == false and
             .tag_name == $tag and
             .target_commitish == $sha' <<<"$published" >/dev/null; then
            echo "::error::GitHub did not publish the expected release state."
            exit 1
          fi
      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_WAS_DRAFT: ${{ needs.validate.outputs.draft }}
          RELEASE_ID: ${{ needs.validate.outputs.release_id }}
          EXPECTED_RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
        run: |
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          if ! jq -e \
            --arg id "$RELEASE_ID" \
            --arg tag "$RELEASE_TAG" \
            '(.id | tostring) == $id and
             .draft == false and
             .immutable == true and
             .tag_name == $tag' <<<"$release" >/dev/null; then
            echo "::error::$RELEASE_TAG is not the expected immutable published release."
            exit 1
          fi

          if [ "$RELEASE_WAS_DRAFT" = "true" ] &&
             [ "$(jq '.assets | length' <<<"$release")" -ne 2 ]; then
            echo "::error::$RELEASE_TAG does not contain the verified wheel and source distribution."
            exit 1
          fi

          gh release verify "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          for asset in dist/*; do
            gh release verify-asset "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY"
          done

          published_sha="$(
            gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha
          )"
          if [ "$published_sha" != "$EXPECTED_RELEASE_SHA" ]; then
            echo "::error::$RELEASE_TAG resolves to $published_sha, expected $EXPECTED_RELEASE_SHA; refusing PyPI publication."
            exit 1
          fi

  publish:
    name: Publish to PyPI
    needs: finalize
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/coverart-cli/
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ env.RELEASE_TAG }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          attestations: true
