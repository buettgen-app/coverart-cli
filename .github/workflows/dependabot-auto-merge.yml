name: Dependabot auto-merge

on:
  # This workflow never checks out or executes pull-request content. The target
  # event is required because Dependabot pull_request tokens are read-only.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable-auto-merge:
    name: Enable safe Dependabot auto-merge
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'buettgen-app/coverart-cli'
    runs-on: ubuntu-latest
    permissions:
      # GitHub requires both permissions to enable native PR auto-merge.
      contents: write # zizmor: ignore[excessive-permissions]
      pull-requests: write # zizmor: ignore[excessive-permissions]
    steps:
      - name: Read verified Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3

      - name: Require registered CI and security merge gates
        id: gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/buettgen-app/coverart-cli/branches/main \
            --jq '.protection.required_status_checks.checks' > "$RUNNER_TEMP/merge-gates.json"
          python3 - <<'PYCODE'
          import json
          import os
          from pathlib import Path

          checks = json.loads((Path(os.environ["RUNNER_TEMP"]) / "merge-gates.json").read_text())
          registered = {
              check["context"] for check in (checks or []) if check.get("app_id") == 15368
          }
          required = {"CI gate", "PR Security Baseline", "Atheris security boundaries"}
          missing = required - registered
          ready = not missing
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"ready={str(ready).lower()}\n")
          if missing:
              print("Auto-merge disabled until GitHub Actions gates are required: " + ", ".join(sorted(missing)))
          PYCODE

      - name: Enable rebase auto-merge for low-risk updates
        if: >-
          steps.gates.outputs.ready == 'true' &&
          (
            steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
            (
              steps.metadata.outputs.update-type == 'version-update:semver-minor' &&
              (
                steps.metadata.outputs.dependency-type == 'direct:development' ||
                steps.metadata.outputs.package-ecosystem == 'github-actions'
              )
            )
          )
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --rebase "$PR_URL"
