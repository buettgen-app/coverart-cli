name: PR Security Baseline

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-security-baseline-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security-baseline:
    name: PR Security Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require immutable action references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          use_pattern = re.compile(r"^\s*(?:-\s*)?uses:\s*([^\s#]+)")
          immutable_pattern = re.compile(r"^[^@\s]+@[0-9a-fA-F]{40}$")
          invalid = []

          for workflow in sorted(Path(".github/workflows").glob("*.y*ml")):
              for line_number, line in enumerate(
                  workflow.read_text(encoding="utf-8").splitlines(), start=1
              ):
                  match = use_pattern.match(line)
                  if not match:
                      continue
                  reference = match.group(1).strip("'\"")
                  if reference.startswith("./"):
                      continue
                  if not immutable_pattern.fullmatch(reference):
                      invalid.append(f"{workflow}:{line_number}: {reference}")

          if invalid:
              print("External workflow references must use full 40-character commit SHAs.")
              print("\n".join(invalid))
              sys.exit(1)
          PY

      - name: Set up Go for Gitleaks
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.11"
          cache: false

      - name: Install pinned Gitleaks
        shell: bash
        env:
          GOBIN: ${{ runner.temp }}/gitleaks-bin
        run: |
          set -euo pipefail
          go install github.com/zricethezav/gitleaks/v8@83d9cd684c87d95d656c1458ef04895a7f1cbd8e
          "$GOBIN/gitleaks" version

      - name: Scan pull request commits for secrets
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks-bin/gitleaks
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          "$GITLEAKS_BIN" git "$GITHUB_WORKSPACE" \
            --log-opts="$BASE_SHA..$HEAD_SHA" \
            --redact=100 \
            --no-banner \
            --exit-code=1

