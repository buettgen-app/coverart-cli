name: Prepare release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.publication.outputs.pending }}
      tag: ${{ steps.publication.outputs.tag }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check publication of the current manifest version
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          manifest="$(gh api "repos/$GITHUB_REPOSITORY/contents/.release-please-manifest.json?ref=$GITHUB_SHA" --jq .content | base64 --decode)"
          version="$(jq -er '.["."] | select(type == "string" and test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' <<<"$manifest")"
          releases="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100")"
          pending="$(jq -ser --arg tag "v$version" '
            [.[][] | select(.tag_name == $tag)] |
            if length > 1 then error("ambiguous manifest release")
            elif length == 1 then
              if (.[0].draft | type) != "boolean" then error("invalid release state")
              else .[0].draft | tostring end
            else "false" end' <<<"$releases")"
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if [ "$pending" = "true" ]; then
            echo "::notice::v$version is still a draft; finish its verified publication before preparing another release PR."
          fi
      - name: Prepare release PR or create release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # A newly created draft is not the latest published release yet. Without this guard,
          # release-please immediately opens the next release PR with the same commit history.
          skip-github-pull-request: >-
            ${{ steps.publication.outputs.pending == 'true' ||
                (github.event_name == 'push' &&
                 startsWith(github.event.head_commit.message, 'chore(main): release ')) }}
      - name: Start verified publication
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
        run: |
          jq -n \
            --arg event_type release-prepared \
            --arg tag "$RELEASE_TAG" \
            --arg sha "$RELEASE_SHA" \
            --arg run_id "$RELEASE_RUN_ID" \
            '{event_type: $event_type, client_payload: {tag: $tag, sha: $sha, run_id: $run_id}}' |
            gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" --input -

  recover-publication:
    name: Recover pending publication through the verified workflow
    needs: release-please
    if: needs.release-please.outputs.pending == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start normal release recovery from main
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Recovery requires a stable manifest release tag."
            exit 1
          fi
          jq -n --arg tag "$RELEASE_TAG" \
            '{ref: "main", inputs: {tag: $tag}}' |
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/dispatches" --input -
