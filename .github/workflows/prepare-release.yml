name: Prepare release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Prepare release PR or create release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # A newly created draft is not the latest published release yet. Without this guard,
          # release-please immediately opens the next release PR with the same commit history.
          skip-github-pull-request: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(main): release ') }}
      - name: Start verified publication
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
        run: |
          jq -n \
            --arg event_type release-prepared \
            --arg tag "$RELEASE_TAG" \
            --arg sha "$RELEASE_SHA" \
            --arg run_id "$RELEASE_RUN_ID" \
            '{event_type: $event_type, client_payload: {tag: $tag, sha: $sha, run_id: $run_id}}' |
            gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" --input -
