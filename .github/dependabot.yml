version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Berlin"
    rebase-strategy: "auto"
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 3
    groups:
      github-actions-nonmajor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:30"
      timezone: "Europe/Berlin"
    rebase-strategy: "auto"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 3
    groups:
      python-nonmajor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
